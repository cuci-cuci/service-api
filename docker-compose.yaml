version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: laundry-postgres
    environment:
      POSTGRES_DB: laundry_db
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laundry-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://laundry:laundry_secret@postgres:5432/laundry_db?sslmode=disable"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      JWT_EXPIRY_HOURS: "24"
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
